<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/jpeg" href="images/sunflower.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc sáng tạo</title>
  <link rel="stylesheet" href="css/gocsangtao.css">
  <script src="js/gocsangtao.js" defer></script>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">🏠</a>
    <h1 class="fire-text">🌸 Tranh vẽ, thiệp điện tử, bài hát, clip... 🌸</h1>
  </header>

 <main style="text-align:center; margin-top:30px;">

<h2>💖 Lớp 8/1 💖</h2>
<div id="videoContainer1" class="video-frame" style="position:relative; display:inline-block;">
  <img src="music/tapthe2.png" alt="Lớp 8/1" style="width:100%; display:block;">
  <button id="playMusicBtn" class="playBtn" data-type="audio" data-src="music/co-oi.mp3" 
          style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:3; padding:10px 20px; font-size:16px; cursor:pointer;">
    ▶️ Phát nhạc
  </button>
  <!-- 🌿 Lá rơi & 💖 Tim bay -->
  <div class="leaf">🍃</div>
  <div class="leaf" style="left:20%;">🍂</div>
  <div class="leaf" style="left:80%; animation-delay:2s;">🌿</div>
  <div class="heart" style="animation-delay:0s;">💖</div>
  <div class="heart" style="animation-delay:1.5s;">💞</div>
  <div class="heart" style="animation-delay:3s;">💗</div>

  <!-- 👇 Thêm vùng hiển thị lời -->
  <div id="lyricsDisplay" style="
  display:none;
  margin-top:15px;
  font-size:18px;
  color:#d63384;
  font-weight:bold;
  white-space:pre-line;
"></div>

</div>

<h2>💖 Thiệp 20/11 💖</h2>
<div id="thiepContainer" class="video-frame">
  <!-- Poster / ảnh đầu tiên -->
  <img id="thiepPoster" src="images/memories/thiep2011.jpg" alt="Thiệp 20/11" />
  
  <!-- Nút Prev/Next -->
  <button id="prevThiep" class="arrow-btn" style="position:absolute;top:50%;left:10px;transform:translateY(-50%);z-index:3;">⬅️</button>
  <button id="nextThiep" class="arrow-btn" style="position:absolute;top:50%;right:10px;transform:translateY(-50%);z-index:3;">➡️</button>
</div>




<h2>💖 Truyện ngắn</h2>
<div id="videoContainer2" class="video-frame">
  <!-- Ảnh poster -->
  <img id="funPoster" src="images/luubut.jpg" alt="Clip vui nhộn" />
  <!-- Nút xem -->
  <button id="loadClipBtn" class="clip-btn" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:3;">
    ▶️ Xem clip
  </button>
</div>

 <h2>💖 Âm nhạc</h2>

<div class="video-slider">
  <div class="video-frame">
    <img id="videoPoster" src="images/poster/co-oi.png" alt="Poster" />
    <video id="mainVideo" controls>
      <source src="videos/co-oi.mp4" type="video/mp4">
    </video>
    <p id="videoTitle">Cô ơi-Candy Ngọc Hà</p>
  </div>

  <!-- ⬇️ Đặt hai nút xuống dưới video -->
  <div class="video-controls">
    <button id="prevVideo" class="arrow-btn">⬅️</button>
    <button id="nextVideo" class="arrow-btn">➡️</button>
  </div>
</div>



  </main>
  
  <!-- Nút nhạc
  <button id="musicToggle" class="music-btn">🎵 Nhạc nền</button>
  <audio id="bgMusic" src="music/ymtht.mp3" loop></audio>-->

</body>
</html>
